# CI for the app (Flutter) and the relay server (Go).
#
# Versions are pinned so a run can be reproduced:
# - Flutter 3.47.7: the version the app's tests and analyzer have been run
#   with; it ships Dart 3.13.5, which pubspec.yaml requires (^3.13.5). The
#   official archive is downloaded and checked against the SHA-256 published
#   in Flutter's releases_linux.json. Move to a newer Flutter in its own PR.
# - Go 1.27.4: the newest Go release when this was written. relay/go.mod
#   requires 1.26 or later; relay tests have also been run with 1.26.11.
# - Rust 1.97.0 for the host builds of flutter_vodozemac's native library
#   (cargo --locked): the spike's (spike/vodozemac) and the app's
#   (tool/build_native_host.sh, for the Olm unit tests). The Android builds are
#   different: the plugin's cargokit runs `rustup run stable cargo build`
#   without --locked, so they use the runner's preinstalled stable Rust.
#   Its version is printed in the log (app-android, spike-android.yml).
# - Actions are pinned to full commit SHAs (tag in the comment).
#
# Actions minutes (docs/decisions/0013-ci-minuter.md):
# - The job "changes" decides which jobs a change needs
#   (.github/scripts/changed-jobs.sh). A change to documentation only runs
#   just that job and its quick check.
# - The pub, Cargo and Gradle downloads, and the Rust builds, are cached.
#   Every run restores the caches; only pushes to main save them, so a pull
#   request cannot change what main and other pull requests get.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One run per branch: a new commit on a pull request cancels the run for the
# older one. Runs on main are not cancelled: "changes" only looks at what each
# push brought in, so a cancelled run on main would leave that push untested.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which of the jobs below this change needs, and the quick check every run
  # gets: whitespace errors and conflict markers in the change, and relative
  # links in changed Markdown files (.github/scripts/check-docs.py).
  changes:
    name: Changed files and quick check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      flutter: ${{ steps.jobs.outputs.flutter }}
      android: ${{ steps.jobs.outputs.android }}
      spike: ${{ steps.jobs.outputs.spike }}
      relay: ${{ steps.jobs.outputs.relay }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The whole history, so that a push's "before" commit is there.
          fetch-depth: 0

      - name: Changed files
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          # A pull request is checked out as GitHub's merge commit. Its first
          # parent is the base branch, so the diff is what the merge brings in.
          if [ "$EVENT" = pull_request ]; then
            base="$(git rev-parse HEAD^1 2>/dev/null || true)"
          else
            base="$BEFORE"
          fi
          # If the diff cannot be made (a new branch, rewritten history), the
          # list is empty and every job runs.
          if [ -n "$base" ] && git diff --name-only "$base" HEAD > "$RUNNER_TEMP/changed.txt"; then
            echo "BASE=$base" >> "$GITHUB_ENV"
          else
            : > "$RUNNER_TEMP/changed.txt"
            echo "BASE=" >> "$GITHUB_ENV"
          fi
          echo "Changed files:"
          cat "$RUNNER_TEMP/changed.txt"

      - name: Test the scripts this job uses
        run: .github/scripts/test-ci-scripts.sh

      - name: Jobs to run
        id: jobs
        run: .github/scripts/changed-jobs.sh < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"

      # License texts under assets/ are kept exactly as their authors wrote
      # them, trailing spaces included.
      - name: Whitespace errors and conflict markers in the change
        if: env.BASE != ''
        run: git diff --check "$BASE" HEAD -- . ':(exclude)assets/'

      - name: Relative links in changed Markdown files
        run: |
          { grep -E '\.md$' "$RUNNER_TEMP/changed.txt" || true; } \
            | tr '\n' '\0' | xargs -0 -r python3 -I .github/scripts/check-docs.py

  flutter:
    name: Flutter analyze and test
    needs: changes
    # The other jobs run even if the quick check failed, so that its result
    # does not hide theirs.
    if: ${{ !cancelled() && needs.changes.outputs.flutter == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
      # P3: the Olm tests (test/crypto/olm_service_test.dart) need
      # flutter_vodozemac's Rust library built for the host.
      RUST_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (checksum verified)
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  ${archive}" | sha256sum -c -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      # P7: test/chain/ runs two apps against the real relay. Same Go as the
      # relay job.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          cache: false

      - name: Flutter version
        run: |
          flutter config --no-analytics
          flutter --version

      - name: Restore the pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get packages (lockfile must match)
        run: flutter pub get --enforce-lockfile

      - name: flutter analyze
        run: flutter analyze

      # The crates' downloads and the host build (tool/build_native_host.sh
      # builds into build/rust). The crates come from flutter_vodozemac's
      # Cargo.lock, which pubspec.lock decides.
      - name: Restore the Cargo cache (host build)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/rust
          key: cargo-host-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cargo-host-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Build the native library for the host
        run: ./tool/build_native_host.sh

      - name: Build the relay for the chain tests
        env:
          # The Go installed above, never one downloaded by the go command.
          GOTOOLCHAIN: local
        run: ./tool/build_relay.sh

      - name: flutter test
        run: flutter test

      - name: Save the pub cache
        if: github.event_name == 'push' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Save the Cargo cache (host build)
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/rust
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  # P2 in docs/ROADMAP.md: the app's APK, with flutter_vodozemac built from
  # source, runs integration_test/olm_build_test.dart on an Android emulator.
  # P3 adds integration_test/vault_test.dart (the Keystore vault, 0005) and
  # integration_test/olm_service_test.dart (Olm behind CryptoService, R8,
  # and the 300 ms measurement in 0005).
  # The same steps as .github/workflows/spike-android.yml.
  app-android:
    name: App on Android emulator (Olm in the build)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
      RUST_TOOLCHAIN: 1.97.0
      SYSTEM_IMAGE: system-images;android-35;google_apis;x86_64
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The runner image is nearly full (see spike-android.yml). Remove
      # preinstalled tools this job never uses, and every NDK except the one
      # Flutter and the plugin build with.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /opt/ghc /usr/local/.ghcup \
            /usr/local/share/powershell /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          if [ -d "$ANDROID_HOME/ndk" ]; then
            find "$ANDROID_HOME/ndk" -mindepth 1 -maxdepth 1 ! -name "$NDK_VERSION" \
              -exec sudo rm -rf {} +
          fi
          df -h /

      - name: Runner resources
        run: |
          echo "cpus=$(nproc)"
          free -m
          swapon --show || true
          df -h /

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (checksum verified)
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  ${archive}" | sha256sum -c -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      # Not what the Android build compiles with: cargokit uses `stable`
      # (see "Rust toolchain used by cargokit" below).
      - name: Install Rust ${{ env.RUST_TOOLCHAIN }} with the Android target
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal --target x86_64-linux-android
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Install Android SDK packages
        run: |
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses > /dev/null
          "$sdkmanager" --install "platform-tools" "emulator" "$SYSTEM_IMAGE" "ndk;$NDK_VERSION" > /dev/null
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/emulator" >> "$GITHUB_PATH"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Its own key: during the APK build, cargokit's build tool fetches more
      # packages into the pub cache than the Flutter job does.
      - name: Restore the pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-android-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-android-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get packages (lockfile must match)
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      # cargokit builds with `rustup run stable` (flutter_vodozemac 0.9.1,
      # cargokit/build_tool/lib/src/builder.dart), not with the toolchain
      # installed above. Print the one it will use; it is also part of the
      # Cargo cache's key.
      - name: Rust toolchain used by cargokit
        id: cargokit-rust
        run: |
          version="$(rustup run stable rustc --version)"
          echo "$version"
          echo "key=$(printf '%s' "$version" | tr -c 'A-Za-z0-9.' '-')" >> "$GITHUB_OUTPUT"

      # Gradle's downloads and the Gradle distribution. ~/.gradle/gradle.properties
      # is written by the next step and is not cached.
      - name: Restore the Gradle cache
        id: gradle-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle.properties', 'android/gradle/wrapper/gradle-wrapper.properties', 'pubspec.lock') }}
          restore-keys: gradle-${{ runner.os }}-

      # The crates' downloads and cargokit's build for Android. cargokit
      # builds into the plugin's Gradle build directory, build/flutter_vodozemac
      # (CARGOKIT_TARGET_TEMP_DIR in cargokit/gradle/plugin.gradle): the target
      # in x86_64-linux-android, build scripts and macros in debug, and its
      # Dart build tool in build_tool.
      - name: Restore the Cargo cache (Android build)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/flutter_vodozemac/x86_64-linux-android
            build/flutter_vodozemac/debug
            build/flutter_vodozemac/build_tool
          key: cargo-android-${{ runner.os }}-${{ steps.cargokit-rust.outputs.key }}-ndk-${{ env.NDK_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: cargo-android-${{ runner.os }}-${{ steps.cargokit-rust.outputs.key }}-ndk-${{ env.NDK_VERSION }}-

      # The runner has 7.9 GB RAM and 0-3 GB swap (both seen). With the project's
      # -Xmx8G (android/gradle.properties) the Gradle daemon grew to 3.8 GB
      # while the emulator held 2-3.4 GB and rustc ran: swap filled up and
      # the runner was shut down ("The runner has received a shutdown
      # signal"). Settings in ~/.gradle/gradle.properties win over the
      # project's: no daemon left running, Kotlin in the same process, and a
      # smaller heap.
      - name: Gradle memory limits for CI
        run: |
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'PROPS'
          org.gradle.daemon=false
          org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=768m -XX:+HeapDumpOnOutOfMemoryError
          kotlin.compiler.execution.strategy=in-process
          PROPS
          cat "$HOME/.gradle/gradle.properties"

      # Build first, while the emulator is not running yet: the Rust part
      # and the Java/Kotlin compile are the memory peak. The test step below
      # reuses most of that build (73 s instead of 344 s, run for e0745db).
      - name: Build the APK before starting the emulator
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/resource-monitor.sh" 20 &
          monitor=$!
          status=0
          flutter build apk --debug --target-platform android-x64 --target integration_test/olm_build_test.dart || status=$?
          kill "$monitor" 2>/dev/null || true
          echo "Gradle and Kotlin processes left after the build:"
          ps -eo rss=,args= | grep -E "GradleDaemon|KotlinCompileDaemon" | grep -v grep || echo "none"
          exit "$status"

      # 0012 (C1) and README: the app asks only for CAMERA and INTERNET, and
      # requires no hardware feature. The camera plugin adds more; the app's
      # manifest removes it, and this fails if anything gets through.
      - name: Permissions and features in the built APK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print \
            build/app/outputs/flutter-apk/app-debug.apk > "$RUNNER_TEMP/manifest.xml"
          python3 -I .github/scripts/check-manifest.py "$RUNNER_TEMP/manifest.xml"

      # Saved right after the build, before the emulator needs the memory.
      - name: Save the pub cache
        if: github.event_name == 'push' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Save the Gradle cache
        if: github.event_name == 'push' && steps.gradle-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches/modules-2
            ~/.gradle/wrapper/dists
            !~/.gradle/caches/modules-2/modules-2.lock
            !~/.gradle/caches/modules-2/gc.properties
          key: ${{ steps.gradle-cache.outputs.cache-primary-key }}

      - name: Save the Cargo cache (Android build)
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            build/flutter_vodozemac/x86_64-linux-android
            build/flutter_vodozemac/debug
            build/flutter_vodozemac/build_tool
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

      - name: Start emulator
        timeout-minutes: 15
        run: |
          ls -l /dev/kvm
          emulator -accel-check || true
          # avdmanager and the emulator must look in the same place.
          export ANDROID_AVD_HOME="$HOME/.android/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --force -n app -k "$SYSTEM_IMAGE" --device pixel_6
          emulator -list-avds | grep -qx app
          nohup emulator -avd app -no-window -no-audio -no-boot-anim \
            -gpu swiftshader_indirect -no-snapshot > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          for _ in $(seq 1 60); do
            adb devices | grep -q '^emulator-5554' && break
            if ! kill -0 "$emulator_pid" 2>/dev/null; then
              echo "::error::the emulator exited"
              exit 1
            fi
            sleep 5
          done
          if ! timeout 60 adb wait-for-device; then
            echo "::error::the emulator did not come up within 5 minutes"
            exit 1
          fi
          booted=""
          for _ in $(seq 1 120); do
            booted="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            [ "$booted" = "1" ] && break
            sleep 5
          done
          if [ "$booted" != "1" ]; then
            echo "::error::the emulator did not finish booting within 10 minutes"
            exit 1
          fi
          echo "abi=$(adb shell getprop ro.product.cpu.abi | tr -d '\r')" \
               "android=$(adb shell getprop ro.build.version.release | tr -d '\r')" \
               "sdk=$(adb shell getprop ro.build.version.sdk | tr -d '\r')"

      # -memory 2048 did not lower the emulator's RAM (hardware-qemu.ini still
      # said 2560, run for e0745db), so no flag is set. This prints what it got.
      - name: Emulator memory settings
        run: |
          grep -i -E "ram|heap|dataPartition|cpu.ncore" \
            "$HOME/.android/avd/app.avd/config.ini" \
            "$HOME/.android/avd/app.avd/hardware-qemu.ini" || true
          free -m

      - name: flutter test integration_test on the emulator
        run: |
          "$GITHUB_WORKSPACE/.github/scripts/resource-monitor.sh" 20 &
          monitor=$!
          status=0
          flutter test integration_test/olm_build_test.dart integration_test/vault_test.dart \
            integration_test/olm_service_test.dart \
            -d emulator-5554 --reporter expanded || status=$?
          kill "$monitor" 2>/dev/null || true
          exit "$status"

      # Covers the build step too, and runs also when a step failed.
      - name: Kernel out-of-memory messages
        if: always()
        run: |
          if out="$(sudo dmesg 2>&1)"; then
            printf '%s\n' "$out" | grep -i -E "out of memory|oom-kill|killed process" || echo "dmesg: no OOM lines"
          else
            echo "dmesg could not be read"
          fi

      - name: Emulator log (on failure)
        if: failure()
        run: tail -n 200 "$RUNNER_TEMP/emulator.log" || true

      # If the app process dies, flutter test only says "did not complete".
      # The crash buffer and the runtime's errors say why. The app itself
      # never logs (test/security/no_logging_test.dart). If an earlier step
      # failed before the emulator started, adb would wait for a device
      # until the job timed out, so each call has a time limit.
      - name: App crash log (on failure)
        if: failure()
        timeout-minutes: 3
        run: |
          if ! timeout 10 adb get-state >/dev/null 2>&1; then
            echo "No emulator is running: nothing to read."
            exit 0
          fi
          timeout 60 adb logcat -d -b crash | tail -n 150 || true
          timeout 60 adb logcat -d -v brief AndroidRuntime:E DEBUG:I libc:F '*:S' | tail -n 150 || true

  spike-vodozemac:
    name: Spike vodozemac (host tests)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.spike == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: spike/vodozemac
    env:
      FLUTTER_VERSION: 3.47.7
      FLUTTER_SHA256: af7455f540df951184c7953fbe3cf884766e7541dacf8571f9f582db03dd6230
      # Builds flutter_vodozemac's Rust library for the host (tool/build_native_host.sh).
      RUST_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Flutter ${{ env.FLUTTER_VERSION }} (checksum verified)
        working-directory: .
        run: |
          archive="$RUNNER_TEMP/flutter.tar.xz"
          curl -fsSL -o "$archive" \
            "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
          echo "${FLUTTER_SHA256}  ${archive}" | sha256sum -c -
          tar -xf "$archive" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"

      - name: Install Rust ${{ env.RUST_TOOLCHAIN }}
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Restore the pub cache
        id: pub-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-spike-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-${{ hashFiles('spike/vodozemac/pubspec.lock') }}
          restore-keys: pub-spike-${{ runner.os }}-flutter-${{ env.FLUTTER_VERSION }}-

      - name: Get packages (lockfile must match)
        run: |
          flutter config --no-analytics
          flutter pub get --enforce-lockfile

      - name: flutter analyze
        run: flutter analyze

      - name: Restore the Cargo cache (host build)
        id: cargo-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            spike/vodozemac/build/rust
          key: cargo-spike-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('spike/vodozemac/pubspec.lock') }}
          restore-keys: cargo-spike-${{ runner.os }}-rust-${{ env.RUST_TOOLCHAIN }}-

      - name: Build the native library for the host
        run: ./tool/build_native_host.sh

      - name: flutter test (requirements R1-R8)
        run: flutter test

      - name: Save the pub cache
        if: github.event_name == 'push' && steps.pub-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: ${{ steps.pub-cache.outputs.cache-primary-key }}

      - name: Save the Cargo cache (host build)
        if: github.event_name == 'push' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            spike/vodozemac/build/rust
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}

  relay:
    name: Relay go vet and go test -race
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.relay == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: relay
    env:
      # Use exactly the Go installed below, never download another one.
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.4'
          # The relay has no dependencies (no go.sum), so there is nothing to cache.
          cache: false

      - name: Go version
        run: go version

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-formatted:" && echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test -race
        run: go test -race -count=1 ./...
