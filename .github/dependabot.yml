# Dependabot version updates, once a week, with minor and patch updates
# grouped so there are few pull requests. Security updates and alerts are
# switched on in the repository settings, not in this file (see
# docs/decisions/0004-olm-integration-design.md, point 12).
#
# Version updates for the Dart packages are off (open-pull-requests-limit: 0,
# the owner's request 2026-11-27). Dependabot resolves pubspec.lock with a
# newer Flutter than the 3.47.7 that CI and the owner build with, so the
# packages Flutter itself pins (test_api, meta, vector_math) change too, and
# `flutter pub get --enforce-lockfile` stops every such pull request (#19,
# #51). No option here sets the Flutter version. The Dart packages are
# updated by hand with Flutter 3.47.7 instead (0004 §12). The entries stay
# so that the setting is easy to find and to turn back on.
#
# Keys checked against the Dependabot options reference on docs.github.com,
# 2026-11-13:
# https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference
#
# Not covered by Dependabot, updated by hand: the Flutter SDK, Go and Rust
# toolchains and the Android NDK/system image pinned in .github/workflows/,
# and the Rust crates that flutter_vodozemac builds from its own Cargo.lock.
version: 2
updates:
  # The app: pubspec.yaml and pubspec.lock in the repository root.
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    # Off: see the top of this file.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(app)"
    groups:
      # The same three Olm packages as in the spike, which must move
      # together and stay equal to the spike's versions (ROADMAP P2).
      olm:
        applies-to: version-updates
        patterns:
          - "flutter_vodozemac"
          - "vodozemac"
          - "flutter_rust_bridge"
      app-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The Olm spike: exact pins and its own lockfile. flutter_vodozemac and
  # vodozemac are released together, and flutter_rust_bridge must match the
  # bindings the plugin generated with it, so the three share one group
  # (all update types, majors included).
  - package-ecosystem: "pub"
    directory: "/spike/vodozemac"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    # Off: see the top of this file.
    open-pull-requests-limit: 0
    commit-message:
      prefix: "deps(spike)"
    groups:
      olm:
        applies-to: version-updates
        patterns:
          - "flutter_vodozemac"
          - "vodozemac"
          - "flutter_rust_bridge"
      spike-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # The relay: only Go's standard library today, so this raises pull
  # requests only if modules are added to relay/go.mod.
  - package-ecosystem: "gomod"
    directory: "/relay"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "deps(relay)"
    groups:
      relay-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"

  # Actions in .github/workflows/, pinned by commit SHA with the version as
  # a comment on the same line; Dependabot updates both.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-and-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
